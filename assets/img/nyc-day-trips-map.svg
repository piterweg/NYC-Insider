<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="trip-map-title trip-map-desc" class="trip-map">
<title id="trip-map-title">Map of day trips from New York City</title>
<desc id="trip-map-desc">New York City with six day-trip destinations: Philadelphia, Washington, Boston, Niagara Falls, the Hudson Valley and Atlantic City, with typical journey times.</desc>
<style>
  .trip-map .trip__line { stroke: #a8853f; stroke-width: 2; stroke-dasharray: 5 6; opacity: .7; fill: none; }
  .trip-map .trip__leader { stroke: #1c1a17; stroke-width: 1.1; stroke-dasharray: 3 3; opacity: .55; }
  .trip-map .trip__point { fill: #1c1a17; }
  .trip-map .trip__pin { fill: #a8853f; stroke: #1c1a17; stroke-width: 1.6; transition: fill .2s ease; }
  .trip-map .trip__num { font-family: "Inter", system-ui, sans-serif; font-weight: 700; font-size: 15px; fill: #1c1a17; pointer-events: none; }
  .trip-map .trip__label { font-family: "Inter", system-ui, sans-serif; font-weight: 600; font-size: 16px; fill: #1c1a17; pointer-events: none; }
  .trip-map .trip__time { font-family: "Inter", system-ui, sans-serif; font-size: 13px; fill: #6a6359; pointer-events: none; }
  .trip-map a:hover .trip__pin, .trip-map a:focus-visible .trip__pin { fill: #1c1a17; }
  .trip-map a:hover .trip__num, .trip-map a:focus-visible .trip__num { fill: #f6f1e8; }
  .trip-map a:focus-visible { outline: none; }
  .trip-map { width: 100%; height: auto; display: block; }
</style>
